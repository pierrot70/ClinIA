services:
  backend-a:
    <<: &backend
      build:
        context: ./backend
        dockerfile: Dockerfile-local
      restart: unless-stopped
      env_file:
        - .env
      environment: &backend-environment
        MONGO_URI: "${MONGO_URI_DOCKER:?Set MONGO_URI_DOCKER in .env}"
        CLINIA_MOCK_AI: "${CLINIA_MOCK_AI:-true}"
        CLINIA_ALLOW_SELF_REGISTRATION: "true"
        OPENAI_MODEL: "gpt-4.1-mini"
        SMTP_HOST: "mailpit"
        SMTP_PORT: "1025"
        SMTP_SECURE: "false"
        SMTP_FROM: "ClinIA <securite@clinique-ai.ca>"
        NODE_ENV: "${NODE_ENV:-development}"
      volumes:
        - ./backend:/app
        - backend_node_modules:/app/node_modules
    environment:
      <<: *backend-environment
      CLINIA_INSTANCE_ID: "local-ha-a"

  backend-b:
    <<: *backend
    environment:
      <<: *backend-environment
      CLINIA_INSTANCE_ID: "local-ha-b"

  backend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "4001:4000"
    volumes:
      - ./infrastructure/nginx/ha-local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-a
      - backend-b

volumes:
  backend_node_modules:

networks:
  default:
    external: true
    name: clinia_local_default
