map $http_x_forwarded_proto $clinia_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_x_forwarded_port $clinia_forwarded_port {
  default $http_x_forwarded_port;
  "" $server_port;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://diabetesjournals.org https://guidelines.diabetes.ca https://www.diabetes.ca https://www.nice.org.uk; frame-ancestors 'none'; form-action 'self'; report-uri /api/security/csp-reports; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(self)" always;

  # Ensure same-origin /api calls reach the backend service in Docker/Coolify.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $clinia_forwarded_port;
    proxy_set_header X-Forwarded-Proto $clinia_forwarded_proto;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }

  location / {
    try_files $uri /index.html;
  }
}
