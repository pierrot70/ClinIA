name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    env:
      # Les créneaux sont présentés dans le fuseau clinique québécois.
      # Les dates Mongo restent des instants UTC; cette valeur stabilise
      # uniquement l'interprétation des fixtures de test.
      TZ: America/Toronto
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit
      - run: node ../scripts/verify-npm-audit.mjs
      - run: npm test -- --run

  frontend:
    name: Frontend tests, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: node ../scripts/verify-npm-audit.mjs
      - run: npm test -- --run
      - run: npm run build
