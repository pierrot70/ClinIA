services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8081/status', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: "${MONGO_EXPRESS_USERNAME:?Set MONGO_EXPRESS_USERNAME in .env}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${MONGO_EXPRESS_PASSWORD:?Set MONGO_EXPRESS_PASSWORD in .env}"

      # Forcer une URL explicite (évite les surprises d'authSource)
      ME_CONFIG_MONGODB_URL: "${MONGO_ADMIN_URI_DOCKER:?Set MONGO_ADMIN_URI_DOCKER in .env}"

      # Optionnel mais utile
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    ports:
      - "8081:8081"
    depends_on:
      - mongo

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    env_file:
      - .env
    environment:
      MONGO_URI: "${MONGO_URI_DOCKER:?Set MONGO_URI_DOCKER in .env}"

      # 🔑 ENV CLINIA (ESSENTIEL)
      CLINIA_MOCK_AI: "${CLINIA_MOCK_AI:-true}"
      CLINIA_ALLOW_SELF_REGISTRATION: "true"
      OPENAI_MODEL: "gpt-4.1-mini"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: "ClinIA <securite@clinique-ai.ca>"

      NODE_ENV: "${NODE_ENV:-development}"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - mongo
      - mailpit



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-local
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      VITE_APP_ENV: "${VITE_APP_ENV:-development}"

      # Empty keeps browser calls relative (/api), so LAN/Tailscale devices
      # can use the frontend dev server proxy instead of their own localhost.
      VITE_API_URL: ""

      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend


volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
