services:
  mongo-key-init:
    image: mongo:7
    restart: "no"
    command:
      - bash
      - -c
      - |
        if [ ! -s /keyfile/mongo-keyfile ]; then
          openssl rand -base64 756 > /keyfile/mongo-keyfile
        fi
        chmod 400 /keyfile/mongo-keyfile
        chown 999:999 /keyfile/mongo-keyfile
    volumes:
      - mongo_keyfile:/keyfile

  mongo:
    image: mongo:7
    restart: always
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /keyfile/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/keyfile:ro
    depends_on:
      mongo-key-init:
        condition: service_completed_successfully

  mongo-replica-1: &mongo-replica
    image: mongo:7
    restart: always
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /keyfile/mongo-keyfile
    volumes:
      - mongo_replica_1_data:/data/db
      - mongo_keyfile:/keyfile:ro
    depends_on:
      mongo-key-init:
        condition: service_completed_successfully

  mongo-replica-2:
    <<: *mongo-replica
    volumes:
      - mongo_replica_2_data:/data/db
      - mongo_keyfile:/keyfile:ro

  backend: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    environment:
      NODE_ENV: production
      MONGO_URI: "${MONGO_URI}"
      JWT_SECRET: "${JWT_SECRET}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: gpt-4.1-mini
      CLINIA_MOCK_AI: "false"
      # Set this to Coolify/Traefik's exact Docker subnet in production.
      # The loopback fallback ignores all client-controlled forwarding headers.
      CLINIA_TRUST_PROXY_CIDRS: "${CLINIA_TRUST_PROXY_CIDRS:-loopback}"
      # Required in production. Generate with: openssl rand -base64 48
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY}"
      MONGO_BACKUP_DIR: /var/backups/clinia/mongo
      MONGO_BACKUP_KEEP_DIR: /var/backups/clinia/mongo-keep
      MONGO_BACKUP_RETENTION_DAYS: "7"
    volumes:
      - /var/backups/clinia/mongo:/var/backups/clinia/mongo:ro
      - /var/backups/clinia/mongo-keep:/var/backups/clinia/mongo-keep:rw
    expose:
      - "4000"
    labels:
      - "traefik.enable=true"

      # API sur le même domaine, seulement pour /api
      - "traefik.http.routers.clinia-api-https.rule=(Host(`clinique-ai.ca`) || Host(`www.clinique-ai.ca`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.clinia-api-https.entrypoints=https"
      - "traefik.http.routers.clinia-api-https.tls=true"
      - "traefik.http.routers.clinia-api-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clinia-api-https.priority=100"

      - "traefik.http.services.clinia-api.loadbalancer.server.port=4000"
      - "traefik.http.routers.clinia-api-https.service=clinia-api"
    depends_on:
      - mongo

  backend-replica:
    <<: *backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"

      # --- HTTP -> HTTPS redirect
      - "traefik.http.routers.clinia-frontend-http.rule=Host(`clinique-ai.ca`) || Host(`www.clinique-ai.ca`)"
      - "traefik.http.routers.clinia-frontend-http.entrypoints=http"
      - "traefik.http.routers.clinia-frontend-http.middlewares=clinia-redirect-to-https"
      - "traefik.http.middlewares.clinia-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.clinia-redirect-to-https.redirectscheme.permanent=true"

      # --- HTTPS (443) with Let's Encrypt via Coolify's Traefik
      - "traefik.http.routers.clinia-frontend-https.rule=Host(`clinique-ai.ca`) || Host(`www.clinique-ai.ca`)"
      - "traefik.http.routers.clinia-frontend-https.entrypoints=https"
      - "traefik.http.routers.clinia-frontend-https.tls=true"
      - "traefik.http.routers.clinia-frontend-https.tls.certresolver=letsencrypt"

      # --- service port inside container
      - "traefik.http.services.clinia-frontend.loadbalancer.server.port=8080"
      - "traefik.http.routers.clinia-frontend-http.service=clinia-frontend"
      - "traefik.http.routers.clinia-frontend-https.service=clinia-frontend"
    depends_on:
      - backend

volumes:
  mongo_data:
  mongo_keyfile:
  mongo_replica_1_data:
  mongo_replica_2_data:
