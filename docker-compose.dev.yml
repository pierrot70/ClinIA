services:
  mongo:
    networks:
      - clinia-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: clinia-backend-dev
    environment:
      NODE_ENV: development
      CLINIA_ALLOW_SELF_REGISTRATION: "true"
      MONGO_URI: "${MONGO_URI_DOCKER:?Set MONGO_URI_DOCKER in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - clinia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: clinia-frontend-dev
    environment:
      VITE_API_URL: ""
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - clinia-net

networks:
  clinia-net:
    driver: bridge
