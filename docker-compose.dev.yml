services:
  mongo:
    networks:
      - clinia-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: clinia-backend-dev
    environment:
      MONGO_URI: mongodb://root:321eRRe!p@mongo:27017/clinia?authSource=admin
      JWT_SECRET: devsecret
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - clinia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: clinia-frontend-dev
    environment:
      VITE_API_URL: ""
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - clinia-net

networks:
  clinia-net:
    driver: bridge
